<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡西欧 991 计算台</title>
    <link rel="stylesheet" href="styles-cn.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">卡西欧风格科学计算器</p>
          <h1>卡西欧 991 计算台</h1>
        </div>
        <p class="hero-copy">面向日常运算、三角函数、矩阵、统计、复数和进制转换的中文计算工作台。</p>
      </section>

      <section class="calculator" aria-label="科学计算器">
        <header class="display-panel">
          <div class="status-bar">
            <span id="modeChip" class="chip chip--mode">标准</span>
            <span id="angleModeChip" class="chip chip--mode">角度：度</span>
            <span id="shiftChip" class="chip chip--shift">副功能：关</span>
            <span id="memoryChip" class="chip chip--memory">内存 0</span>
          </div>
          <div id="expressionView" class="expression" aria-live="polite"></div>
          <div id="previewView" class="preview" aria-live="polite"></div>
          <div id="hoverHint" class="hint-bar" aria-live="polite">将鼠标移到按钮上查看功能说明。</div>
        </header>

        <nav class="mode-tabs" aria-label="模式切换">
          <button class="mode-tab is-active" type="button" data-mode="standard" data-tip="标准模式：表达式、常量、函数和记忆运算">标准</button>
          <button class="mode-tab" type="button" data-mode="matrix" data-tip="矩阵模式：加减乘、转置、行列式和逆矩阵">矩阵</button>
          <button class="mode-tab" type="button" data-mode="stats" data-tip="统计模式：录入数据并查看均值、方差和标准差">统计</button>
          <button class="mode-tab" type="button" data-mode="complex" data-tip="复数模式：四则运算、共轭、模长和辐角">复数</button>
          <button class="mode-tab" type="button" data-mode="base" data-tip="进制模式：二、八、十、十六进制之间转换">进制</button>
        </nav>

        <div class="workspace">
          <section class="keypad-panel">
            <div class="panel-card panel-card--main">
              <div class="panel-head">
                <h2>标准键盘</h2>
                <span class="panel-subtitle">鼠标悬停可查看说明</span>
              </div>
              <div id="keypad" class="keypad" aria-label="计算键盘"></div>
            </div>
          </section>

          <aside class="side-panel">
            <section class="panel-card">
              <div class="panel-head">
                <h2>模式工作区</h2>
                <span id="modeSubtitle" class="panel-subtitle">标准计算</span>
              </div>
              <div id="modeWorkspace" class="mode-workspace"></div>
            </section>

            <section class="panel-card">
              <div class="panel-head">
                <h2>计算记录</h2>
                <button id="clearHistoryBtn" class="ghost-btn" type="button">清空记录</button>
              </div>
              <ol id="historyList" class="history-list"></ol>
            </section>

            <section class="panel-card">
              <div class="panel-head">
                <h2>函数库</h2>
                <span class="panel-subtitle">点击即可插入</span>
              </div>
              <div id="functionLibrary" class="chip-grid"></div>
            </section>
          </aside>
        </div>
      </section>
    </main>

    <script src="app-cn.js"></script>
  </body>
</html>
