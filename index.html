<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="卡西欧风格中文科学计算器：标准运算、方程、矩阵、向量、统计、微积分、复数、进制转换与逻辑运算。" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; form-action 'none'; base-uri 'none'" />
    <title>卡西欧 991 计算台</title>
    <link rel="stylesheet" href="styles-cn.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator" aria-label="科学计算器">
        <header class="display-panel">
          <div class="display-main">
            <div class="display-content">
              <div class="status-bar">
                <span id="modeChip" class="chip chip--mode">标准</span>
                <span id="angleModeChip" class="chip chip--mode">角度：度</span>
                <span id="shiftChip" class="chip chip--shift">副功能：关</span>
                <span id="memoryChip" class="chip chip--memory">内存 0</span>
              </div>
              <div id="expressionView" class="expression" aria-live="polite"></div>
              <div id="previewView" class="preview" aria-live="polite"></div>
              <div id="hoverHint" class="hint-bar" aria-live="polite">将鼠标移到按钮上查看功能说明。</div>
            </div>
            <aside class="display-history">
              <div class="panel-head">
                <h2>计算记录</h2>
                <button id="clearHistoryBtn" class="ghost-btn" type="button">清空记录</button>
              </div>
              <ol id="historyList" class="history-list"></ol>
            </aside>
          </div>
        </header>

        <section class="command-rail" aria-label="快速查找与常用操作">
          <div class="command-search panel-card">
            <div class="panel-head panel-head--compact">
              <h2>快速查找</h2>
              <span id="uiSearchStatus" class="panel-subtitle">输入关键字筛选按钮</span>
            </div>
            <div class="search-row">
              <label class="sr-only" for="uiSearchInput">搜索按钮、模式或功能</label>
              <input id="uiSearchInput" class="search-input" type="search" placeholder="搜索按钮、模式或功能，例如 sin、矩阵、清空" autocomplete="off" spellcheck="false" />
              <button id="clearUiSearchBtn" class="ghost-btn ghost-btn--compact" type="button">清除</button>
            </div>
          </div>

          <div class="quick-actions panel-card" aria-label="高频操作">
            <button class="chip-btn chip-btn--quick" type="button" data-action="shift">副功能</button>
            <button class="chip-btn chip-btn--quick" type="button" data-action="angle">角度</button>
            <button class="chip-btn chip-btn--quick" type="button" data-action="ac">清空</button>
            <button class="chip-btn chip-btn--quick" type="button" data-action="del">删除</button>
            <button class="chip-btn chip-btn--quick" type="button" data-action="Ans">Ans</button>
            <button class="chip-btn chip-btn--quick" type="button" data-action="pi">π</button>
            <button class="chip-btn chip-btn--quick" type="button" data-action="e">e</button>
            <button class="chip-btn chip-btn--quick" type="button" data-action="mr">取内存</button>
            <button class="chip-btn chip-btn--quick" type="button" data-action="mplus">内存加</button>
            <button class="chip-btn chip-btn--quick" type="button" data-action="mminus">内存减</button>
          </div>
        </section>

        <nav class="mode-tabs" role="tablist" aria-label="模式切换">
          <button class="mode-tab is-active" role="tab" aria-selected="true" aria-controls="modeWorkspace" type="button" data-mode="standard" data-tip="标准模式：表达式、常量、函数和记忆运算">标准</button>
          <button class="mode-tab" role="tab" aria-selected="false" aria-controls="modeWorkspace" type="button" data-mode="equation" data-tip="方程模式：线性方程组、多项式、不等式、SOLVE、比例式">方程</button>
          <button class="mode-tab" role="tab" aria-selected="false" aria-controls="modeWorkspace" type="button" data-mode="matrix" data-tip="矩阵模式：加减乘、转置、行列式和逆矩阵">矩阵</button>
          <button class="mode-tab" role="tab" aria-selected="false" aria-controls="modeWorkspace" type="button" data-mode="vector" data-tip="向量模式：v1/v2 加减、点积、叉积、模长、夹角">向量</button>
          <button class="mode-tab" role="tab" aria-selected="false" aria-controls="modeWorkspace" type="button" data-mode="stats" data-tip="统计模式：录入数据并查看均值、方差和标准差">统计</button>
          <button class="mode-tab" role="tab" aria-selected="false" aria-controls="modeWorkspace" type="button" data-mode="calculus" data-tip="微积分模式：数值微分、积分与Σ求和">微积分</button>
          <button class="mode-tab" role="tab" aria-selected="false" aria-controls="modeWorkspace" type="button" data-mode="complex" data-tip="复数模式：四则运算、共轭、模长和辐角">复数</button>
          <button class="mode-tab" role="tab" aria-selected="false" aria-controls="modeWorkspace" type="button" data-mode="base" data-tip="进制模式：二、八、十、十六进制之间转换">进制</button>
          <button class="mode-tab" role="tab" aria-selected="false" aria-controls="modeWorkspace" type="button" data-mode="logic" data-tip="逻辑模式：AND、OR、NOT、XOR、XNOR">逻辑</button>
          <button class="mode-tab" role="tab" aria-selected="false" aria-controls="modeWorkspace" type="button" data-mode="table" data-tip="表格模式：输入 f(x)/g(x) 与范围步长，生成函数值表">表格</button>
          <button class="mode-tab" role="tab" aria-selected="false" aria-controls="modeWorkspace" type="button" data-mode="tools" data-tip="工具模式：分数、DMS、极直坐标、常数、单位换算等">工具</button>
        </nav>

        <div class="workspace">
          <section class="keypad-panel">
            <div class="panel-card panel-card--main">
              <div class="panel-head">
                <h2>标准键盘</h2>
              </div>
              <div id="keypad" class="keypad" aria-label="计算键盘"></div>
            </div>
          </section>

          <aside class="side-panel">
            <section class="panel-card">
              <div class="panel-head">
                <h2>模式工作区</h2>
                <span id="modeSubtitle" class="panel-subtitle">标准计算</span>
              </div>
              <div id="modeWorkspace" class="mode-workspace"></div>
            </section>
          </aside>
        </div>
      </section>
    </main>

    <script src="app-cn.js"></script>
  </body>
</html>
